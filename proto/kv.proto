syntax = "proto3";

package kv;

service Cluster {
  rpc Heartbeat (HeartbeatRequest) returns (HeartbeatReply);
  rpc Replicate (LogEntry) returns (ReplicateReply);
  rpc Forward (ForwardRequest) returns (ForwardReply);
  rpc RequestVote (RequestVoteRequest) returns (RequestVoteReply);
}

message HeartbeatRequest {
  string nodeId = 1;
  int32 term = 2;
}

message HeartbeatReply {
  string nodeId = 1;
  bool ok = 2;
  int32 term = 3;
}

message LogEntry {
  string key = 1;
  string value = 2;
  int32 lsn = 3;
  bool deleted = 4;
}

message ReplicateReply {
  bool ok = 1;
}

// A client write forwarded from a follower to the leader (no LSN — the leader mints it).
message ForwardRequest {
  string key = 1;
  string value = 2;
  bool deleted = 3;
}

enum ForwardReplyStatus {
  UNSPECIFIED = 0;
  OK = 1;
  NOT_FOUND = 2;
  NO_MAJORITY_ACK = 3;
}

message ForwardReply {
  ForwardReplyStatus status = 1;
  int32 lsn = 2;
}

message RequestVoteRequest {
  int32 term = 1;
  string candidateId = 2;
  int32 lastLsn = 3;
}

message RequestVoteReply {
  int32 term = 1;
  bool voteGranted = 2;
}